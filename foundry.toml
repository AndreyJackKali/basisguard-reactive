[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
    "@reactive/=lib/reactive-lib-omni/",
    "forge-std/=lib/forge-std/src/"
]

[fuzz]
runs = 256
max_test_rejects = 65536

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC}"
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC}"
sepolia = "${SEPOLIA_RPC}"
lasna = "${LASNA_RPC}"
